name: Sync Zephyr Docs

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Comma-separated Zephyr tags (example: v3.5.0,v3.6.0)"
        required: true
        type: string
      source_url_template:
        description: "Source URL template; use {version} placeholder"
        required: false
        default: "https://docs.zephyrproject.org/{version}"
        type: string
      zephyr_repo:
        description: "Zephyr source repository"
        required: false
        default: "https://github.com/zephyrproject-rtos/zephyr.git"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: sync-zephyr-docs-${{ github.ref }}
  cancel-in-progress: false

env:
  ZEPHYR_BUILD_IMAGE: ghcr.io/zephyrproject-rtos/zephyr-build:latest

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tags_json: ${{ steps.collect.outputs.tags_json }}
      tags_csv: ${{ steps.collect.outputs.tags_csv }}
      latest_tag: ${{ steps.collect.outputs.latest_tag }}
      source_url_template: ${{ steps.collect.outputs.source_url_template }}
      zephyr_repo: ${{ steps.collect.outputs.zephyr_repo }}
    steps:
      - name: Collect requested tags
        id: collect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" ]]; then
            RAW_TAGS="${GITHUB_REF_NAME}"
          else
            RAW_TAGS="${{ inputs.tags }}"
          fi

          CLEANED=$(printf '%s' "$RAW_TAGS" | tr ',;' '\n' | sed 's/^ *//;s/ *$//' | sed '/^$/d' | sort -u)
          if [[ -z "$CLEANED" ]]; then
            echo "No valid tags were provided"
            exit 1
          fi

          TAGS_CSV=$(printf '%s' "$CLEANED" | paste -sd, -)
          TAGS_JSON=$(printf '%s\n' "$CLEANED" | jq -Rsc 'split("\n") | map(select(length>0))')
          LATEST=$(printf '%s\n' "$CLEANED" | sort -V | tail -n1)

          if [[ "${{ github.event_name }}" == "push" ]]; then
            SOURCE_TEMPLATE="https://docs.zephyrproject.org/{version}"
            ZEPHYR_REPO="https://github.com/zephyrproject-rtos/zephyr.git"
          else
            SOURCE_TEMPLATE="${{ inputs.source_url_template }}"
            ZEPHYR_REPO="${{ inputs.zephyr_repo }}"
          fi

          echo "tags_json=$TAGS_JSON" >> "$GITHUB_OUTPUT"
          echo "tags_csv=$TAGS_CSV" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "source_url_template=$SOURCE_TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "zephyr_repo=$ZEPHYR_REPO" >> "$GITHUB_OUTPUT"

  build-and-convert:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.prepare.outputs.tags_json) }}
    steps:
      - name: Free disk space for the SDK and docs build
        shell: bash
        run: |
          set -euo pipefail
          echo "Before:"
          df -h /
          # The full Zephyr SDK expands to several GB on top of the build image;
          # drop preinstalled toolchains this job never uses to make room.
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          echo "After:"
          df -h /

      - name: Checkout pipeline repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Pull zephyr-build image
        run: |
          set -euo pipefail
          # This image is ~32G unpacked. Round-tripping it through the Actions
          # cache as a `docker save` tar cost ~230s to restore plus a ~21min pull
          # step, because the save ran on every run even on a cache hit -- 42% of
          # the job. It also held 6.18G of the repo's 10G cache quota, which the
          # SDK cache needs. Pull the layers from ghcr instead.
          time docker pull "$ZEPHYR_BUILD_IMAGE"

      - name: Clone Zephyr source at tag
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ matrix.tag }}" "${{ needs.prepare.outputs.zephyr_repo }}" zephyr-src

      - name: Resolve required Zephyr SDK version
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          # Read it here rather than in the container so it can key the cache.
          SDK_VERSION="$(tr -d '[:space:]' < zephyr-src/SDK_VERSION)"
          if [[ -z "$SDK_VERSION" ]]; then
            echo "Could not read SDK_VERSION from the Zephyr tree"
            exit 1
          fi
          echo "Zephyr ${{ matrix.tag }} requires Zephyr SDK $SDK_VERSION"
          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Zephyr SDK
        uses: actions/cache@v6
        with:
          path: zephyr-sdk
          key: zephyr-sdk-${{ steps.sdk.outputs.version }}-linux-x86_64

      - name: Build Zephyr docs and convert to Markdown
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ matrix.tag }}"
          VERSION="${TAG#v}"
          SOURCE_TEMPLATE="${{ needs.prepare.outputs.source_url_template }}"
          SOURCE_URL="${SOURCE_TEMPLATE//\{version\}/$VERSION}"

          mkdir -p "$PWD/artifacts/$TAG"
          # Exists already on a cache hit; create it so the bind mount below does
          # not have Docker make it, and so the cache always has a path to save.
          mkdir -p "$PWD/zephyr-sdk"

          docker run --rm \
            -v "$PWD/zephyr-src:/tmp/zephyrproject/zephyr" \
            -v "$PWD/zephyr-sdk:/opt/zephyr-sdk" \
            -v "$PWD:/work/pipeline" \
            --user 0:0 \
            -w /work/pipeline \
            -e TAG="$TAG" \
            -e SOURCE_URL="$SOURCE_URL" \
            -e SDK_VERSION="${{ steps.sdk.outputs.version }}" \
            "$ZEPHYR_BUILD_IMAGE" \
            bash -lc '
              set -euo pipefail

              python3 --version
              cmake --version
              ninja --version

              python3 -m pip install --upgrade pip
              python3 -m pip install --upgrade west

              # zephyr-src is mounted at /tmp/zephyrproject/zephyr so west init -l
              # can write .west into the writable /tmp/zephyrproject parent.
              cd /tmp/zephyrproject
              west init -l zephyr
              west update -n -o=--depth=1

              python3 -m pip install --upgrade -r /tmp/zephyrproject/zephyr/doc/requirements.txt
              python3 -m pip install --upgrade -r /work/pipeline/scripts/requirements-convert.txt

              # SDK_VERSION comes from the runner, which read it from the tree for
              # this tag: the required version is per-tag (0.16.5 for v3.6.0 through
              # 1.0.1 on main), so it can never be pinned in the workflow.
              if [[ -z "${SDK_VERSION:-}" ]]; then
                echo "SDK_VERSION was not provided"
                exit 1
              fi

              # SDK 0.16/0.17 keep toolchains at the top level; SDK 1.0 moved them
              # under gnu/. Accept either, or a 1.0 SDK looks empty and gets rejected.
              # A directory alone is never enough: the _minimal bundle unpacks to a
              # valid looking SDK holding no toolchains at all, which is how a
              # toolchain-less install silently emptied the board catalog.
              sdk_has_toolchains() {
                [[ -n "$1" && -d "$1" ]] || return 1
                compgen -G "$1/*-zephyr-*" > /dev/null \
                  || compgen -G "$1/gnu/*-zephyr-*" > /dev/null
              }

              url_exists() {
                if command -v curl >/dev/null 2>&1; then
                  curl -fsIL -o /dev/null "$1"
                else
                  wget -q --spider "$1"
                fi
              }

              # /opt/zephyr-sdk is a mount of the runner-side cache.
              SDK_DIR=/opt/zephyr-sdk

              if sdk_has_toolchains "$SDK_DIR"; then
                echo "Restored Zephyr SDK $SDK_VERSION from cache"
              else
                for CANDIDATE in "${ZEPHYR_SDK_INSTALL_DIR:-}" \
                                 "/opt/toolchains/zephyr-sdk-${SDK_VERSION}"; do
                  if sdk_has_toolchains "$CANDIDATE"; then
                    SDK_DIR="$CANDIDATE"
                    echo "Reusing Zephyr SDK already present in the image at $SDK_DIR"
                    break
                  fi
                done
              fi

              if ! sdk_has_toolchains "$SDK_DIR"; then
                # The docs build CMake-configures every board to harvest its
                # Devicetree, so it needs every target toolchain -- upstream builds
                # its own HTML docs with toolchains: all for the same reason.
                # 0.16/0.17 ship one full bundle; 1.0 split it and renamed the GNU
                # half. Probe rather than guess from the version number.
                SDK_BASE="https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}"
                SDK_URL=""
                for NAME in "zephyr-sdk-${SDK_VERSION}_linux-x86_64.tar.xz" \
                            "zephyr-sdk-${SDK_VERSION}_linux-x86_64_gnu.tar.xz"; do
                  if url_exists "${SDK_BASE}/${NAME}"; then
                    SDK_URL="${SDK_BASE}/${NAME}"
                    break
                  fi
                done
                if [[ -z "$SDK_URL" ]]; then
                  echo "No full Zephyr SDK bundle published for $SDK_VERSION"
                  exit 1
                fi

                echo "Installing Zephyr SDK $SDK_VERSION from $SDK_URL"
                mkdir -p "$SDK_DIR"
                # Stream into tar so the ~2G archive never sits on disk beside its
                # own ~7G expansion; strip the versioned top level so the cached
                # path stays stable.
                if command -v curl >/dev/null 2>&1; then
                  curl -fsSL "$SDK_URL" | tar -C "$SDK_DIR" -xJ --strip-components=1
                elif command -v wget >/dev/null 2>&1; then
                  wget -qO- "$SDK_URL" | tar -C "$SDK_DIR" -xJ --strip-components=1
                else
                  echo "Neither curl nor wget is available in the container"
                  exit 1
                fi
              fi

              export ZEPHYR_SDK_INSTALL_DIR="$SDK_DIR"
              if ! sdk_has_toolchains "$ZEPHYR_SDK_INSTALL_DIR"; then
                echo "Zephyr SDK at $ZEPHYR_SDK_INSTALL_DIR has no toolchains"
                exit 1
              fi
              # Registers the CMake package under $HOME, which is never cached, so
              # this has to run on every build and not just on a cache miss.
              "$SDK_DIR/setup.sh" -c
              echo "Using Zephyr SDK at $ZEPHYR_SDK_INSTALL_DIR"
              df -h /opt

              cmake -GNinja -B /tmp/zephyrproject/zephyr/doc/_build -S /tmp/zephyrproject/zephyr/doc -DDOC_TAG="$TAG" -DSPHINXOPTS="-j auto --keep-going -T"
              cmake --build /tmp/zephyrproject/zephyr/doc/_build --target html

              python3 /work/pipeline/scripts/convert.py \
                --input-html-root /tmp/zephyrproject/zephyr/doc/_build/html \
                --output-root "/work/pipeline/artifacts/$TAG" \
                --version "$TAG" \
                --base-source-url "$SOURCE_URL" \
                --clean
            '

      - name: Upload Markdown artifact
        uses: actions/upload-artifact@v7
        with:
          name: markdown-${{ matrix.tag }}
          path: artifacts/${{ matrix.tag }}

  publish:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-and-convert
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all converted artifacts
        uses: actions/download-artifact@v8
        with:
          path: _downloaded

      - name: Merge generated versions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p versions
          IFS=',' read -r -a TAG_ARRAY <<< "${{ needs.prepare.outputs.tags_csv }}"

          # download-artifact's output layout is not stable across major versions:
          # it nests each artifact under _downloaded/<name>/ when several are
          # downloaded but flattens a single one straight into _downloaded/. Locate
          # each tree by the _manifest.json convert.py writes, which names the
          # version it contains, rather than assuming a path shape.
          declare -A SRC_FOR
          while IFS= read -r MANIFEST; do
            V="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$MANIFEST")"
            SRC_FOR["$V"]="$(dirname "$MANIFEST")"
          done < <(find _downloaded -type f -name _manifest.json)

          FOUND="${!SRC_FOR[*]}"
          echo "Found converted trees for: ${FOUND:-<none>}"

          for TAG in "${TAG_ARRAY[@]}"; do
            SRC_DIR="${SRC_FOR[$TAG]:-}"
            if [[ -z "$SRC_DIR" ]]; then
              echo "Missing artifact for $TAG; found: ${FOUND:-<none>}"
              find _downloaded -maxdepth 2 | head -40
              exit 1
            fi

            DEST_DIR="versions/$TAG"
            rm -rf "$DEST_DIR"
            mkdir -p "$DEST_DIR"
            cp -R "$SRC_DIR"/. "$DEST_DIR"/
            echo "Copied $(find "$DEST_DIR" -name '*.md' -type f | wc -l) .md files to $DEST_DIR"
          done

          # `latest` tracks the newest version present in the repository, not the
          # newest tag in this run. Re-syncing an older tag on its own would
          # otherwise overwrite versions/latest with older docs while the index
          # below still advertised the newer one. Same computation as that step.
          mapfile -t ALL_VERSIONS < <(find versions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -v '^latest$' | sort -V)
          if [[ ${#ALL_VERSIONS[@]} -eq 0 ]]; then
            echo "No version directories present after merge"
            exit 1
          fi
          LATEST="${ALL_VERSIONS[${#ALL_VERSIONS[@]} - 1]}"
          echo "Pointing versions/latest at $LATEST"
          rm -rf versions/latest
          mkdir -p versions/latest
          cp -R "versions/$LATEST"/. versions/latest/

      - name: Regenerate versions index
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t VERSION_DIRS < <(find versions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | grep -v '^latest$' | sort -V)

          if [[ ${#VERSION_DIRS[@]} -eq 0 ]]; then
            echo "No version directories found"
            exit 1
          fi

          LAST_INDEX=$((${#VERSION_DIRS[@]} - 1))
          LATEST="${VERSION_DIRS[$LAST_INDEX]}"

          {
            echo '{'
            echo "  \"latest\": \"$LATEST\","
            echo '  "versions": ['
            for i in "${!VERSION_DIRS[@]}"; do
              v="${VERSION_DIRS[$i]}"
              comma=','
              if [[ "$i" -eq $((${#VERSION_DIRS[@]} - 1)) ]]; then
                comma=''
              fi
              echo "    \"$v\"$comma"
            done
            echo '  ]'
            echo '}'
          } > versions/versions.json

      - name: Validate generated markdown
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_markdown.py versions

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add versions

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "docs: sync zephyr markdown for ${{ needs.prepare.outputs.tags_csv }}"
          git push
